[project]
name = "stylevault"
version = "0.1.0"
description = "Local image library for Adrift: scan, embed, cluster, map, search, train."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pillow>=10.3.0",
  "numpy>=1.26.4",
  "hdbscan>=0.8.38",
  "umap-learn>=0.5.6",
  "huggingface_hub>=0.23.0",
  "safetensors>=0.4.0",
  "torch>=2.2.0",
  "transformers>=4.56.0",
]

[project.optional-dependencies]
text-detection = ["open-clip-torch>=2.24.0"]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[project.scripts]
stylevault = "stylevault.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stylevault = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
