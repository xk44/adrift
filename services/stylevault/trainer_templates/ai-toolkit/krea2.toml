---
job: extension
config:
  name: "{{run_name}}"
  process:
    - type: sd_trainer
      training_folder: "{{output_dir}}"
      device: cuda:0
      trigger_word: "{{trigger_word}}"
      network:
        type: lora
        linear: {{rank}}
        linear_alpha: {{rank}}
      save:
        dtype: bf16
        save_every: 500
        max_step_saves_to_keep: 2
      datasets:
        - folder_path: "{{dataset_dir}}"
          caption_ext: "{{caption_ext_nodot}}"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [{{resolution}}]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: {{steps}}
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: {{lr}}
        dtype: bf16
        skip_first_sample: true
        disable_sampling: true
      model:
        # Krea 2 Turbo single-file checkpoint (Krea OSS format). Set via the base_model arg/param
        # or STYLEVAULT_BASE_MODEL_KREA2. Text encoder + VAE default to the HF repos
        # Qwen/Qwen3-VL-4B-Instruct and Qwen/Qwen-Image (override in model_kwargs with HF-format dirs).
        name_or_path: "{{model_path}}"
        arch: krea2
        quantize: true
        quantize_te: true
        low_vram: true
        assistant_lora_path: "{{assistant_lora_path}}"
      sample:
        sampler: flowmatch
        sample_every: 500
        width: {{resolution}}
        height: {{resolution}}
        prompts:
          - "{{trigger_word}} style sample"
        neg: ""
        seed: 42
        guidance_scale: 3
        sample_steps: 25
meta:
  name: "{{run_name}}"
  model_family: "{{model_family}}"
