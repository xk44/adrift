# Model folders for the ComfyUI container. The host model directory is
# mounted read-only at /models using the standard ComfyUI layout
# (/models/diffusion_models, /models/loras, ...). Extra custom-node folders
# can be mounted at /custom_nodes.
adrift:
  base_path: /models/
  is_default: true
  checkpoints: checkpoints/
  diffusion_models: |
    diffusion_models/
    unet/
  loras: loras/
  vae: vae/
  text_encoders: |
    text_encoders/
    clip/
  clip_vision: clip_vision/
  model_patches: model_patches/
  audio_encoders: audio_encoders/
  frame_interpolation: frame_interpolation/
  geometry_estimation: geometry_estimation/
  background_removal: background_removal/
  upscale_models: upscale_models/
  latent_upscale_models: latent_upscale_models/
  controlnet: controlnet/
  embeddings: embeddings/
  ultralytics: ultralytics/
  ultralytics_bbox: ultralytics/bbox/
  ultralytics_segm: ultralytics/segm/
  sams: sams/
  style_models: style_models/
  custom_nodes: /custom_nodes/
