name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No ComfyUI on the runner: point at an empty folder so nothing local leaks in.
      COMFY_ROOT: ${{ github.workspace }}/.no-comfyui
    steps:
      - uses: actions/checkout@v4
      # runner.temp isn't allowed in job-level env, so set it from the shell.
      - name: Isolate runtime settings
        run: echo "ADRIFT_RUNTIME_SETTINGS_FILE=$RUNNER_TEMP/adrift-runtime-settings.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
